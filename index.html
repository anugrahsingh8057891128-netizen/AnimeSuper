<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anime Super</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  min-height:60px;
  background:#15151d;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ff3b81;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:500px;
  margin:auto;
}

.search input{
  width:100%;
  background:#24242e;
  border:none;
  outline:none;
  color:#fff;
  padding:11px 15px;
  border-radius:20px;
}

main{padding:18px}

.page{display:none}
.page.active{display:block}

.home-title{
  font-size:22px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:15px;
}

.card{
  background:#15151d;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}

.card-title{
  padding:10px;
  font-size:14px;
  font-weight:bold;
  line-height:1.3;
}

.details{
  max-width:900px;
  margin:auto;
}

.back{
  background:#24242e;
  border:none;
  color:#fff;
  padding:9px 15px;
  border-radius:7px;
  cursor:pointer;
  margin-bottom:15px;
}

.detail-top{
  display:flex;
  gap:20px;
}

.poster{
  width:220px;
  height:320px;
  object-fit:cover;
  border-radius:10px;
}

.info{flex:1}

.info h1{
  font-size:28px;
  margin-bottom:12px;
}

.info p{
  color:#bbb;
  line-height:1.6;
  margin-bottom:15px;
}

.watch-btn{
  background:#ff3b81;
  color:#fff;
  border:none;
  padding:11px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.season-bar{
  margin-top:25px;
  margin-bottom:15px;
}

.season-select,
.player-select{
  background:#24242e;
  color:#fff;
  border:1px solid #333;
  padding:10px 13px;
  border-radius:7px;
  outline:none;
}

#serverSelect{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

#serverSelect button{
  cursor:pointer;
}

#serverSelect button.active{
  border-color:#fff;
}

.episodes{margin-top:20px}
.episodes h2{margin-bottom:12px}

.episode-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:8px;
}

.episode{
  background:#24242e;
  padding:11px;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
}

.episode:hover{
  background:#ff3b81;
}

.player-page{
  max-width:1000px;
  margin:auto;
}

.player-title{
  margin-bottom:15px;
}

.player-box{
  width:100%;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.video-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video-wrap video,
.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.notice{
  background:#181820;
  border-left:3px solid #ff3b81;
  padding:12px;
  margin-top:15px;
  color:#bbb;
  line-height:1.5;
}

.coming{
  color:#ffb3cd;
  font-weight:bold;
}

@media(max-width:600px){

  main{padding:12px}

  header{gap:8px}

  .logo{font-size:18px}

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .detail-top{
    flex-direction:column;
  }

  .poster{
    width:180px;
    height:260px;
  }

  .info h1{
    font-size:23px;
  }
}
</style>
</head>

</div>

<div class="player-controls">

<select

<select

</section>

</main>

async function loadAnimeFromD1(){
  try {
    const response=await fetch("/api/public/anime");
    const data=await response.json();
    if(!data.success) throw new Error(data.error || "Failed to load anime");

    anime={};
    data.anime.forEach(item=>{
      anime[String(item.id)]={
        title:item.title,
        poster:item.poster,
        description:item.description,
        movie:Boolean(item.movie),
        available:Boolean(item.available)
      };
    });

    renderAnime();
  }catch(error){
    console.error("D1 anime load error:",error);
    renderAnime();
  }
}
async function loadAnimeContentFromD1(id){
  try {
    const episodeResponse=await fetch("/api/public/anime/"+id+"/episodes");
    const episodeData=await episodeResponse.json();

    videos[id]={};
    seasons[id]={};
    episodeLanguages[id]=[];
    episodeQualities[id]=new Set();
    episodeServers[id]={};

    if(episodeData.success){
      episodeData.episodes.forEach(ep=>{
        const season=String(ep.season || 1);
        const episode=String(ep.episode);

        if(!seasons[id][season]){
          seasons[id][season]={
            name:"Season "+season,
            episodes:[]
          };
        }

        seasons[id][season].episodes.push(Number(ep.episode));

        if(ep.language){
          if(!episodeLanguages[id]) episodeLanguages[id]=[];
          if(!episodeLanguages[id].includes(ep.language)){
            episodeLanguages[id].push(ep.language);
          }
        }

        if(!episodeQualities[id]) episodeQualities[id]=new Set();
        if(ep.url_360 || ep.url_360_server2) episodeQualities[id].add("360p");
        if(ep.url_720 || ep.url_720_server2) episodeQualities[id].add("720p");
        if(ep.url_1080 || ep.url_1080_server2) episodeQualities[id].add("1080p");

        videos[id][episode]={};
        if(ep.url_360) videos[id][episode]["360p"]=ep.url_360;
        if(ep.url_720) videos[id][episode]["720p"]=ep.url_720;
        if(ep.url_1080) videos[id][episode]["1080p"]=ep.url_1080;

        episodeServers[id][episode]={};

        episodeServers[id][episode]["360p"]={
          server1:ep.url_360 || "",
          server2:ep.url_360_server2 || ""
        };

        episodeServers[id][episode]["720p"]={
          server1:ep.url_720 || "",
          server2:ep.url_720_server2 || ""
        };

        episodeServers[id][episode]["1080p"]={
          server1:ep.url_1080 || "",
          server2:ep.url_1080_server2 || ""
        };
      });
    }

    const movieResponse=await fetch("/api/public/anime/"+id+"/movies");
    const movieData=await movieResponse.json();

    movies[id]={};
    movieServers[id]={};

    if(movieData.success){
      movieData.movies.forEach(movie=>{
        const language=movie.language.replace(" Dub","");
        if(!movies[id][language]) movies[id][language]={};
        movies[id][language][movie.quality]=movie.url;
        if(!movieServers[id][language]) movieServers[id][language]={};
        movieServers[id][language][movie.quality]={
          server1:movie.url || "",
          server2:movie.url_server2 || ""
        };
      });
    }

    return true;
  }catch(error){
    console.error("D1 content load error:",error);
    return false;
  }
}



function renderAnime(
list=Object.keys(anime)
){

document.getElementById("animeGrid");

/* ================================
   DETAILS
================================ */

async function openDetails(id){

stopPlayers();

currentAnime=id;

await loadAnimeContentFromD1(id);

if(seasons[id]){
currentSeason=Number(Object.keys(seasons[id])[0]);
}


const data=anime[id];

document.getElementById("detailPoster")
.src=data.poster;

document.getElementById("detailTitle")
.textContent=data.title;

document.getElementById("detailDescription")
.textContent=data.description;

document.getElementById("seasonContainer")
.innerHTML="";

document.getElementById("episodeContainer")
.innerHTML="";

const watchButton=
document.getElementById("watchButton");


/* MOVIE AVAILABLE */

if(data.movie && movies[id]){

watchButton.style.display="inline-block";

const audioList=
Object.keys(movies[id]);

const qualitySet=
new Set();

audioList.forEach(audio=>{

Object.keys(movies[id][audio])
.forEach(q=>qualitySet.add(q));

});

document.getElementById("episodeContainer")
.innerHTML=`

<div class="notice">

Audio:
${audioList.join(" • ")}

<br><br>

Quality:
${["1080p","720p","360p"].filter(q=>qualitySet.has(q)).join(" • ")}

</div>

`;

}


/* MOVIE COMING SOON */

else if(data.movie){

watchButton.style.display="none";

document.getElementById("episodeContainer")
.innerHTML=`

<div class="notice coming">
Coming Soon
</div>

`;

}


/* ANIME WITH SEASONS */

else if(seasons[id] && Object.keys(seasons[id]).length > 0){

watchButton.style.display="none";

createSeasonSelector();

renderSeasonEpisodes();

}


/* NORMAL EPISODES */

else if(videos[id] && Object.keys(videos[id]).length > 0){

watchButton.style.display="none";

renderNormalEpisodes();

}


/* NO EPISODES */

else{

watchButton.style.display="none";

document.getElementById("episodeContainer")
.innerHTML=`

<div class="notice coming">
Episodes Coming Soon
</div>

`;

}

showPage("detailsPage");

}

function openEpisodePlayer(){

.textContent="";

/* ================================
   DIRECT SERVER
================================ */

function setupDirectServers(){

const serverSelect=
document.getElementById("serverSelect");

serverSelect.innerHTML="";

const data=
episodeServers[currentAnime]
?.[currentEpisode]
?.[currentQuality];

if(!data)return;

const servers=[];

if(data.server1){
servers.push({
id:"server1",
name:"Server 1"
});
}

if(data.server2){
servers.push({
id:"server2",
name:"Server 2"
});
}

if(!servers.length)return;

if(
!currentServer ||
!data[currentServer]
){
currentServer=servers[0].id;
}

servers.forEach(server=>{

const button=
document.createElement("button");

button.type="button";
button.className="player-select";

button.textContent=
server.name;

if(server.id===currentServer){
button.classList.add("active");
}

button.onclick=()=>{

currentServer=server.id;

setupDirectServers();

loadDirectVideo();

};

serverSelect.appendChild(button);

});

}


/* ================================
   DIRECT QUALITY
================================ */

function setupDirectQualities(){

qualitySelect.innerHTML="";

const data=
episodeServers[currentAnime]
?.[currentEpisode];

if(!data)return;

const qualities=["1080p","720p","360p"].filter(q=>
data[q] &&
(data[q].server1 || data[q].server2)
);

currentQuality=
qualities[0];

qualities.forEach(q=>{

const option=
document.createElement("option");

option.value=q;
option.textContent=q;

qualitySelect.appendChild(option);

});

qualitySelect.value=
currentQuality;

qualitySelect.onchange=()=>{

currentQuality=
qualitySelect.value;

currentServer=null;

setupDirectServers();

loadDirectVideo();

};

}


/* ================================
   DIRECT VIDEO
================================ */

function loadDirectVideo(){

const serverData=
episodeServers[currentAnime]
?.[currentEpisode]
?.[currentQuality];

if(!serverData)return;

if(
!currentServer ||
!serverData[currentServer]
){
currentServer=
serverData.server1
? "server1"
: "server2";
}

const url=
serverData[currentServer];

if(!url)return;

video.pause();
video.removeAttribute("src");
video.load();

embedPlayer.src="";
embedPlayer.style.display="none";
video.style.display="none";

if(url.includes("vidmoly.org/embed-")){

embedPlayer.src=url;
embedPlayer.style.display="block";

}else{

video.style.display="block";

setTimeout(()=>{

video.src=url;
video.load();

},80);

}

}

   WATCH MOVIE
================================ */

function watchMovie(){

if(!movies[currentAnime])return;

const audioList=
Object.keys(movies[currentAnime]);

if(audioList.includes("English Dub")){

currentAudio="English Dub";

}else{

currentAudio=audioList[0];

}

Object.keys(
movies[currentAnime][currentAudio]
);

if(qualities.includes("720p")){

currentQuality="720p";

}else{

}

openMoviePlayer();

}

[currentAudio];

["1080p","720p","360p"].filter(q=>data[q] || movieServers[currentAnime]?.[currentAudio]?.[q]?.server2).forEach(q=>{
