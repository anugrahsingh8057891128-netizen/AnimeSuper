<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anime Super</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  min-height:60px;
  background:#15151d;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ff3b81;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:500px;
  margin:auto;
}

.search input{
  width:100%;
  background:#24242e;
  border:none;
  outline:none;
  color:#fff;
  padding:11px 15px;
  border-radius:20px;
}

main{padding:18px}

.page{display:none}
.page.active{display:block}

.home-title{
  font-size:22px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:15px;
}

.card{
  background:#15151d;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}

.card-title{
  padding:10px;
  font-size:14px;
  font-weight:bold;
  line-height:1.3;
}

.details{
  max-width:900px;
  margin:auto;
}

.back{
  background:#24242e;
  border:none;
  color:#fff;
  padding:9px 15px;
  border-radius:7px;
  cursor:pointer;
  margin-bottom:15px;
}

.detail-top{
  display:flex;
  gap:20px;
}

.poster{
  width:220px;
  height:320px;
  object-fit:cover;
  border-radius:10px;
}

.info{flex:1}

.info h1{
  font-size:28px;
  margin-bottom:12px;
}

.info p{
  color:#bbb;
  line-height:1.6;
  margin-bottom:15px;
}

.watch-btn{
  background:#ff3b81;
  color:#fff;
  border:none;
  padding:11px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.season-bar{
  margin-top:25px;
  margin-bottom:15px;
}

.season-select,
.player-select{
  background:#24242e;
  color:#fff;
  border:1px solid #333;
  padding:10px 13px;
  border-radius:7px;
  outline:none;
}

#serverSelect{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

#serverSelect button{
  cursor:pointer;
}

#serverSelect button.active{
  border-color:#fff;
}

.episodes{margin-top:20px}
.episodes h2{margin-bottom:12px}

.episode-list{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:10px 3px 16px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
  scrollbar-color:#8b5cf6 #171321;
  -webkit-overflow-scrolling:touch;
}

.episode{
  flex:0 0 112px;
  min-height:76px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:13px;
  text-align:left;
  border-radius:12px;
  cursor:pointer;
  scroll-snap-align:start;
  background:linear-gradient(145deg,#211831,#15111f);
  border:1px solid rgba(196,181,253,.16);
  color:#eee8ff;
  transition:background .2s,border-color .2s,transform .2s,box-shadow .2s;
}

.episode-meta{
  display:block;
  width:100%;
  font-size:10px;
  line-height:1.5;
  color:#d8c9ff;
  overflow-wrap:anywhere;
}

.episode::before{
  content:"EPISODE";
  font-size:10px;
  letter-spacing:1.4px;
  color:#b7a4e8;
}

.episode:hover{
  background:linear-gradient(145deg,#352052,#211632);
  border-color:#a78bfa;
  transform:translateY(-2px);
}

.episode.active{
  background:linear-gradient(145deg,#7c3aed,#4c1d95);
  border-color:#c4b5fd;
  box-shadow:0 0 18px rgba(139,92,246,.3);
}

.episode.active::before{
  content:"NOW PLAYING";
  color:#fff;
}

@media(max-width:600px){
  .episode{flex-basis:100px;min-height:70px;padding:11px}
}

.player-page{
  max-width:1000px;
  margin:auto;
}

.player-title{
  margin-bottom:15px;
}

.player-box{
  width:100%;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.video-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video-wrap video,
.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.notice{
  background:#181820;
  border-left:3px solid #ff3b81;
  padding:12px;
  margin-top:15px;
  color:#bbb;
  line-height:1.5;
}

.coming{
  color:#ffb3cd;
  font-weight:bold;
}

@media(max-width:600px){

  main{padding:12px}

  header{gap:8px}

  .logo{font-size:18px}

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .detail-top{
    flex-direction:column;
  }

  .poster{
    width:180px;
    height:260px;
  }

  .info h1{
    font-size:23px;
  }
}

/* PREMIUM VIOLET THEME */
:root{
  color-scheme:dark;
  --bg:#08070d;
  --surface:#12101c;
  --surface-hover:#1b1729;
  --accent:#a78bfa;
  --accent-strong:#8b5cf6;
  --border:rgba(196,181,253,.16);
  --muted:#aaa4bb;
}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(ellipse at 50% -15%,#21133b 0%,#0b0912 42%,var(--bg) 78%);
  color:#f7f4ff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header{
  background:rgba(13,11,21,.88);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}
.logo{
  color:#c4b5fd;
  letter-spacing:-.5px;
  text-shadow:0 0 22px rgba(167,139,250,.24);
}
.search input{
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.search input:focus{
  border-color:var(--accent-strong);
  background:rgba(167,139,250,.06);
  box-shadow:0 0 0 3px rgba(139,92,246,.13);
}
main{max-width:1500px;margin:0 auto}
.home-title{
  font-size:clamp(23px,3vw,30px);
  font-weight:750;
  letter-spacing:-.6px;
  margin:8px 0 20px;
}
.grid{gap:18px}
.card{
  background:linear-gradient(160deg,#191524,#100e18);
  border:1px solid rgba(196,181,253,.09);
  border-radius:13px;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{
  transform:translateY(-5px);
  border-color:rgba(167,139,250,.55);
  box-shadow:0 12px 28px rgba(0,0,0,.32),0 0 18px rgba(139,92,246,.09);
}
.card img{transition:transform .3s ease}
.card:hover img{transform:scale(1.025)}
.card-title{
  padding:12px;
  line-height:1.45;
  color:#f1edff;
}
.back,.season-select,.player-select,.episode{
  background:#171321;
  border:1px solid var(--border);
  color:#eee8ff;
  border-radius:9px;
  transition:background .2s,border-color .2s,transform .2s;
}
.back:hover,.season-select:hover,.player-select:hover{
  background:#251b39;
  border-color:var(--accent-strong);
}
.watch-btn{
  background:linear-gradient(135deg,#a78bfa,#7c3aed);
  border:1px solid rgba(221,214,254,.22);
  border-radius:10px;
  box-shadow:0 5px 18px rgba(124,58,237,.22);
  transition:transform .2s,box-shadow .2s;
}
.watch-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,58,237,.35);
}
.info p{color:var(--muted)}
.poster{
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.episode{
  border-radius:9px;
  padding:12px 8px;
}
.episode:hover{
  background:#352052;
  border-color:var(--accent-strong);
  transform:translateY(-2px);
}
.player-box{
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}
.notice{
  background:rgba(167,139,250,.065);
  border-left-color:var(--accent-strong);
  border-radius:0 10px 10px 0;
  color:#c5bdd8;
}
.coming{color:#c4b5fd}
#adsterra-native-banner{margin-top:24px}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}
@media(max-width:600px){
  header{padding:10px 12px}
  main{padding:14px 12px}
  .grid{gap:12px}
  .card{border-radius:11px}
  .card-title{padding:10px;font-size:13px}
  .detail-top{gap:16px}
  .player-box{border-radius:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}


/* CINEMATIC HERO BANNER */
.hero-banner {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  min-height: 320px;
  margin: 22px 0 30px;
  padding: 34px;
  overflow: hidden;
  border: 1px solid rgba(167, 110, 255, .32);
  border-radius: 22px;
  background: linear-gradient(110deg, #171020, #08070d);
  box-shadow: 0 14px 42px rgba(0, 0, 0, .32),
              -10px 0 32px rgba(124, 58, 237, .22),
              10px 0 32px rgba(124, 58, 237, .22);
}
.hero-banner .hero-backdrop {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  opacity: .62;
}
.hero-banner::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(90deg, rgba(8, 7, 13, .96) 0%, rgba(8, 7, 13, .78) 42%, rgba(8, 7, 13, .12) 100%),
              linear-gradient(0deg, rgba(8, 7, 13, .72), transparent 65%);
}
.hero-content {
  max-width: 590px;
}
.hero-kicker {
  margin: 0 0 12px;
  color: #c4a0ff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.hero-title {
  margin: 0 0 12px;
  color: #fff;
  font-size: clamp(28px, 5vw, 48px);
  line-height: 1.08;
  font-weight: 900;
  text-shadow: 0 3px 18px rgba(0, 0, 0, .4);
}
.hero-description {
  max-width: 520px;
  margin: 0 0 22px;
  color: #d2cedc;
  font-size: 14px;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #a970ff, #7440d9);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 7px 24px rgba(130, 75, 230, .3);
  transition: transform .2s ease, filter .2s ease;
}
.hero-action:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
}
@media (max-width: 600px) {
  .hero-banner {
    min-height: 300px;
    margin: 16px 0 24px;
    padding: 24px 18px;
    border-radius: 17px;
  }
  .hero-banner .hero-backdrop {
    object-position: center;
    opacity: .48;
  }
  .hero-banner::after {
    background: linear-gradient(90deg, rgba(8, 7, 13, .82), rgba(8, 7, 13, .28)),
                linear-gradient(0deg, rgba(8, 7, 13, .72), transparent);
  }
  .hero-banner {
    box-shadow: 0 12px 30px rgba(0, 0, 0, .3),
                -7px 0 24px rgba(124, 58, 237, .2),
                7px 0 24px rgba(124, 58, 237, .2);
  }
  .hero-title {
    font-size: 30px;
  }
  .hero-description {
    font-size: 13px;
    -webkit-line-clamp: 3;
  }
}

<style id="premiumNeonTheme">

:root{

  --bg-card: #121218;

}

*{ font-family: 'Inter', sans-serif !important; box-sizing: border-box; }

/* HEADER */
header, .navbar, nav {

/* SEARCH BAR */

/* ANIME CARDS GRID */
.anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 20px 40px; }
.anime-card {
  background: transparent !important;
  border: none !important;
  transition: 0.4s !important;
  cursor: pointer;
}
.anime-card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 16px;
  transition: 0.4s;
}
.anime-card:hover img { transform: scale(1.05) translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
.anime-card h3 { font-size: 14px; font-weight: 700; margin: 10px 0 5px 0; color: white; }
.anime-card p { font-size: 12px; color: var(--text-secondary); margin: 0; }

/* BADGES & RATINGS */
.badge, .tag {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
  color: white; font-size: 10px; padding: 3px 8px; border-radius: 4px;
  font-weight: 600;
}
.rating { color: #fbbf24; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }

/* TRENDING SIDEBAR */
.trending-sidebar { background: var(--bg-card); border-radius: 20px; padding: 20px; border: 1px solid var(--border-subtle); }
.trending-item { display: flex; align-items: center; gap: 15px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.trending-item img { width: 50px; height: 70px; border-radius: 8px; object-fit: cover; }
.trending-number { font-size: 20px; font-weight: 800; color: var(--text-secondary); width: 25px; }

/* SECTION TITLES */
.section-title { font-size: 22px; font-weight: 700; padding: 0 40px; margin-top: 40px; display: flex; align-items: center; justify-content: space-between; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

async function loadAnimeFromD1(){
  try {
    const response=await fetch("/api/public/anime");
    const data=await response.json();
    if(!data.success) throw new Error(data.error || "Failed to load anime");

    anime={};
    data.anime.forEach(item=>{
      anime[String(item.id)]={
        title:item.title,
        poster:item.poster,
        description:item.description,
        movie:Boolean(item.movie),
        available:Boolean(item.available)
      };
    });

    renderAnime();
    renderHero();
  }catch(error){
    console.error("D1 anime load error:",error);
    renderAnime();
    renderHero();
  }
}
async function loadAnimeContentFromD1(id){
  try {
    const episodeResponse=await fetch("/api/public/anime/"+id+"/episodes");
    const episodeData=await episodeResponse.json();

    videos[id]={};
    seasons[id]={};
    episodeLanguages[id]=[];
    episodeQualities[id]=new Set();
    episodeServers[id]={};
    episodeLanguageData[id]={};

    if(episodeData.success){
      episodeData.episodes.forEach(ep=>{
        const season=String(ep.season || 1);
        const episode=String(ep.episode);
        const language=String(ep.language || "Hindi");

        if(!seasons[id][season]){
          seasons[id][season]={name:"Season "+season,episodes:[]};
        }
        if(!seasons[id][season].episodes.includes(Number(ep.episode))){
          seasons[id][season].episodes.push(Number(ep.episode));
        }

        if(!episodeLanguages[id].includes(language)){
          episodeLanguages[id].push(language);
        }

        if(ep.url_360 || ep.url_360_server2) episodeQualities[id].add("360p");
        if(ep.url_720 || ep.url_720_server2) episodeQualities[id].add("720p");
        if(ep.url_1080 || ep.url_1080_server2) episodeQualities[id].add("1080p");

        if(!episodeLanguageData[id][season]) episodeLanguageData[id][season]={};
        if(!episodeLanguageData[id][season][episode]) episodeLanguageData[id][season][episode]={};

        const languageData={
          "360p":{server1:ep.url_360 || "",server2:ep.url_360_server2 || ""},
          "720p":{server1:ep.url_720 || "",server2:ep.url_720_server2 || ""},
          "1080p":{server1:ep.url_1080 || "",server2:ep.url_1080_server2 || ""}
        };
        episodeLanguageData[id][season][episode][language]=languageData;

        if(!videos[id][episode]) videos[id][episode]={};
        if(!episodeServers[id][episode]) episodeServers[id][episode]={};

        ["360p","720p","1080p"].forEach(q=>{
          const row=languageData[q];
          if(row.server1 && !videos[id][episode][q]) videos[id][episode][q]=row.server1;
          if(!episodeServers[id][episode][q]) episodeServers[id][episode][q]={server1:"",server2:""};
          if(row.server1 && !episodeServers[id][episode][q].server1) episodeServers[id][episode][q].server1=row.server1;
          if(row.server2 && !episodeServers[id][episode][q].server2) episodeServers[id][episode][q].server2=row.server2;
        });
      });
    }

    const movieResponse=await fetch("/api/public/anime/"+id+"/movies");
    const movieData=await movieResponse.json();

    movies[id]={};
    movieServers[id]={};

    if(movieData.success){
      movieData.movies.forEach(movie=>{
        const language=movie.language.replace(" Dub","");
        if(!movies[id][language]) movies[id][language]={};
        const server2Url=movie.url_server2 || "";
        const server1Url=(movie.url && movie.url !== server2Url) ? movie.url : "";
        movies[id][language][movie.quality]=server1Url;
        if(!movieServers[id][language]) movieServers[id][language]={};
        movieServers[id][language][movie.quality]={
          server1:server1Url,
          server2:server2Url
        };
      });
    }

    return true;
  }catch(error){
    console.error("D1 content load error:",error);
    return false;
  }
}



function renderHero(){
  const banner = document.getElementById("heroBanner");
  if(!banner) return;

  if(renderHero.timer) clearInterval(renderHero.timer);
  if(renderHero.fadeTimer) clearTimeout(renderHero.fadeTimer);

  const slides = Object.keys(anime).filter(id =>
    id !== "3" && anime[id] && anime[id].title && anime[id].poster
  );

  if(!slides.length){
    banner.style.display = "none";
    banner.replaceChildren();
    return;
  }

  let currentIndex = Number.isInteger(renderHero.index)
    ? renderHero.index % slides.length
    : Math.floor(Math.random() * slides.length);

  banner.style.display = "flex";
  banner.style.overflow = "hidden";

  function buildSlide(index){
    const featuredId = slides[index];
    const featured = anime[featuredId];

    const slide = document.createElement("div");
    slide.className = "hero-slide";
    slide.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;padding:34px;box-sizing:border-box;";

    const backdrop = document.createElement("img");
    backdrop.className = "hero-backdrop";

  const first = buildSlide(currentIndex);

  renderHero.index = currentIndex;

  if(slides.length > 1){

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * slides.length);
      } while(nextIndex === currentIndex && slides.length > 1);

      const currentSlide = banner.querySelector(".hero-slide");
      const next = buildSlide(nextIndex);
      next.style.transform = "translateX(100%)";
      next.style.zIndex = "2";
      next.style.transition = "transform .65s ease-in-out";
      banner.appendChild(next);

      requestAnimationFrame(() => {

            currentSlide.style.transform = "translateX(-100%)";

        currentIndex = nextIndex;
        renderHero.index = currentIndex;

function getCurrentEpisodeLanguageOptions(){
return episodeLanguageData[currentAnime]?.[String(currentSeason || 1)]?.[String(currentEpisode)] || {};
}

function getCurrentEpisodeServerData(){
const languageOptions=getCurrentEpisodeLanguageOptions();
if(Object.keys(languageOptions).length){
if(!currentEpisodeLanguage || !languageOptions[currentEpisodeLanguage]){
currentEpisodeLanguage=Object.keys(languageOptions)[0];
}
return languageOptions[currentEpisodeLanguage];
}
return null;
}

function openEpisodePlayer(){
showPage("playerPage");

function updateEpisodeNavigation(){
const previous=document.getElementById("previousEpisodeBtn");
const next=document.getElementById("nextEpisodeBtn");
const label=document.getElementById("episodeNavigationLabel");
const seasonData=seasons[currentAnime];
let episodes=[];
let hasPrevious=false;
let hasNext=false;
if(seasonData&&Object.keys(seasonData).length){
const seasonKeys=Object.keys(seasonData).sort((a,b)=>Number(a)-Number(b));
const seasonIndex=seasonKeys.indexOf(String(currentSeason));
episodes=(seasonData[currentSeason]?.episodes||[]).map(Number).sort((a,b)=>a-b);
const episodeIndex=episodes.indexOf(Number(currentEpisode));
hasPrevious=episodeIndex>0||seasonIndex>0;
hasNext=episodeIndex>=0&&(episodeIndex<episodes.length-1||seasonIndex<seasonKeys.length-1);
}else{
episodes=Object.keys(videos[currentAnime]||{}).map(Number).sort((a,b)=>a-b);
const episodeIndex=episodes.indexOf(Number(currentEpisode));
hasPrevious=episodeIndex>0;
hasNext=episodeIndex>=0&&episodeIndex<episodes.length-1;
}
previous.disabled=!hasPrevious;
next.disabled=!hasNext;
label.textContent=seasonData&&seasonData[currentSeason]?"Season "+currentSeason+" • Episode "+currentEpisode:"Episode "+currentEpisode;
}

function navigateEpisode(direction){
const seasonData=seasons[currentAnime];
if(seasonData&&Object.keys(seasonData).length){
const seasonKeys=Object.keys(seasonData).sort((a,b)=>Number(a)-Number(b));
let seasonIndex=seasonKeys.indexOf(String(currentSeason));
let episodes=(seasonData[currentSeason]?.episodes||[]).map(Number).sort((a,b)=>a-b);
let episodeIndex=episodes.indexOf(Number(currentEpisode));
let targetIndex=episodeIndex+direction;
if(targetIndex<0){
seasonIndex--;
if(seasonIndex<0)return;
currentSeason=Number(seasonKeys[seasonIndex]);
episodes=(seasonData[currentSeason]?.episodes||[]).map(Number).sort((a,b)=>a-b);
currentEpisode=episodes[episodes.length-1];
}else if(targetIndex>=episodes.length){
seasonIndex++;
if(seasonIndex>=seasonKeys.length)return;
currentSeason=Number(seasonKeys[seasonIndex]);
episodes=(seasonData[currentSeason]?.episodes||[]).map(Number).sort((a,b)=>a-b);
currentEpisode=episodes[0];
}else{
currentEpisode=episodes[targetIndex];
}
}else{
const episodes=Object.keys(videos[currentAnime]||{}).map(Number).sort((a,b)=>a-b);
const index=episodes.indexOf(Number(currentEpisode))+direction;
if(index<0||index>=episodes.length)return;
currentEpisode=episodes[index];
}
openEpisodePlayer();
}

.card:hover{

  border-color:rgba(196,181,253,.38);

}
.card:hover img{filter:brightness(1.04)}

.details{max-width:1100px}

  box-shadow:0 8px 24px rgba(0,0,0,.24);

.info h1{
  margin-bottom:13px;
  color:#f8f6fc;
  font-size:clamp(24px,3.4vw,36px);
  line-height:1.16;
  letter-spacing:-.6px;
}
.info p{color:var(--muted);line-height:1.75}

  border-radius:8px;
  background:#191820;
  color:#f0edf7;
}
.back:hover,.season-select:hover,.player-select:hover{
  border-color:#75619e;
  background:#211e2a;
}
.watch-btn{

  background:#c4b5fd;
  color:#17111f;
  box-shadow:none;
}
.watch-btn:hover{background:#d4c9ff;transform:translateY(-1px);box-shadow:none}
.season-bar{margin-top:27px}
.episodes{margin-top:24px}

.episode-list{scrollbar-color:#62527f #17161c}
.episode{

  border-radius:9px;
  background:#17161d;
  color:#eeeaf7;
}
.episode-meta{color:#bdb0dc}

  border-color:#8871bd;
  background:#211c2c;
  transform:translateY(-2px);
}
.episode.active{

  background:#34264c;

}
.episode-navigation{
  border:1px solid var(--line);
  border-radius:12px;
  background:#15141b;
  box-shadow:none;

  border-radius:8px;
  background:#211e29;
  color:#f4f0ff;
}
.episode-navigation .back:not(:disabled):hover{

  background:#2a2436;
  box-shadow:none;
}

.player-page{max-width:1100px}
.player-title{

  font-size:clamp(22px,3vw,30px);
  letter-spacing:-.4px;
}
.player-box{
  border:1px solid #302d38;
  border-radius:12px;

}
.player-controls{gap:10px}
.notice{
  border-left-color:#a78bfa;
  border-radius:0 8px 8px 0;
  background:#17151e;
  color:#c4c0ce;
}
.coming{color:#c4b5fd}
#adsterra-native-banner{margin-top:24px}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{

  outline-offset:3px;
}

  main{padding:16px 12px}
  .home-title{margin:8px 0 16px;font-size:24px}
  .hero-banner{
    min-height:285px;
    margin:12px 0 26px;
    padding:23px 17px;
    border-radius:12px;
    box-shadow:0 8px 22px rgba(0,0,0,.22);

    background:linear-gradient(90deg,rgba(9,9,13,.9),rgba(9,9,13,.4)),

  }

  .card{border-radius:9px}

  .detail-top{gap:16px}
  .poster{width:150px;height:auto}
  .info h1{font-size:23px}
  .player-box{border-radius:9px}
  .player-controls{padding:10px;gap:8px}
  .episode-navigation{gap:7px;padding:10px 8px}

  #episodeNavigationLabel{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
